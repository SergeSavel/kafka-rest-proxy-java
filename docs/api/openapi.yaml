  /producer/send:
    post:
      tags: [producer]
      summary: Send a message to a topic
      description: |
        Request content types:
        - `application/json` — key, value and header values are strings
        - `application/octet-stream` — binary format v1 (see the request schema
          description for the layout)

        The response format is selected by the `Accept` header (falls back to the
        request `Content-Type` when `Accept` is absent or `*/*`): JSON returns
        `ProducerSendResponse`, octet-stream returns the binary format v1:

        ```
        int16  version (1)
        string topic            — int32 length + UTF-8 bytes
        int32  partition
        int64  offset
        int64  timestamp
        int32  serializedKeySize
        int32  serializedValueSize
        ```
      operationId: producerSend
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProducerSendStringRequest'}
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: |
                Binary send format v1, big-endian:

                ```
                int16  version (1)
                string producerId       — int32 length + UTF-8 bytes
                string token
                string topic
                int8   partitionIsNull (1 = null, 0 = present)
                [int32 partition]       — present only when not null
                int32  headersCount     — max 900
                headersCount × {
                  string headerKey
                  int8   headerValueIsNull
                  [int32 headerValueLength + bytes]
                }
                int8   keyIsNull
                [int32 keyLength + bytes]
                int8   valueIsNull
                [bytes value — the rest of the buffer]
                ```
      responses:
        '201':
          description: Message sent
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProducerSendResponse'}
            application/octet-stream:
              schema:
                type: string
                format: binary
                description: Binary format v1 — see the operation description
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}

