openapi: 3.1.0
info:
  title: Kafka HTTP Gateway
  version: 5.1.0
  description: |
    HTTP gateway exposing Kafka Producer, Consumer and AdminClient APIs over HTTP.

    ## Instances
    Every operation (except `POST /admin/create` and `GET /admin`) requires `adminId`
    (instance UUID) and `token` (ownership token returned by `POST /admin/create`).
    Instances expire after `expirationTimeout` milliseconds of inactivity (timer resets
    on every request); use `POST /admin/touch` to keep an instance alive.

    ## Authentication
    HTTP Basic auth is **optional and server-dependent**: it is enabled only when a
    `users.json` file is present in the gateway working directory.

    ## Errors
    Error responses carry a `text/plain` body with the error message and **close the
    connection** (`Connection: close`). Status codes:
    - `400` — bad request (invalid JSON, validation failure, unknown topic/partition, invalid Kafka request)
    - `401` — not authenticated (Kafka `AuthenticationException`)
    - `403` — not authorized (Kafka `AuthorizationException`, broker ACLs)
    - `404` — unknown admin instance or unknown route
    - `405` — unsupported HTTP method
    - `409` — conflict (topic exists, group not empty, reassignment in progress, illegal state)
    - `500` — internal error (timeout, interrupted, unexpected)

    ## JSON conventions
    - Unknown properties in request bodies are rejected (`400`).
    - Missing primitive fields (`int`, `long`, `boolean`, `short`) are rejected (`400`).
    - Boolean getters named `isX` are serialized as `x` (e.g. `isInternal` → `internal`).
    - Kafka topic UUIDs are represented as base64url strings.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:8086
    description: Local gateway

tags:
  - name: lifecycle
    description: AdminClient instance management
  - name: topics
    description: Topic management
  - name: configs
    description: Topic and broker configuration
  - name: cluster
    description: Cluster metadata
  - name: scram
    description: SCRAM user credentials
  - name: acls
    description: Access control lists
  - name: producers
    description: Transactional producers
  - name: groups
    description: Consumer, classic, share and streams groups
  - name: offsets
    description: Partition offset lookups
  - name: producer
    description: KafkaProducer instance management, send and transactions
  - name: consumer
    description: KafkaConsumer instance management, poll, offsets, subscriptions

paths:
  /admin:
    get:
      tags: [lifecycle]
      summary: List admin instances
      operationId: adminList
      responses:
        '200':
          description: Admin instances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminListResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /admin/create:
    post:
      tags: [lifecycle]
      summary: Create an AdminClient instance
      description: |
        Creates a new `KafkaAdmin` instance. The `config` map accepts arbitrary
        Kafka client properties (`bootstrap.servers`, SASL, etc.). Returns the
        instance id and the ownership token.
      operationId: adminCreate
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminCreateRequest'}
      responses:
        '201':
          description: Instance created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminCreateResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /admin/release:
    post:
      tags: [lifecycle]
      summary: Release (close) an admin instance
      operationId: adminRelease
      requestBody: {$ref: '#/components/requestBodies/AdminInstanceRef'}
      responses:
        '204': {description: Instance released}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /admin/touch:
    post:
      tags: [lifecycle]
      summary: Reset the expiration timer of an admin instance
      operationId: adminTouch
      requestBody: {$ref: '#/components/requestBodies/AdminInstanceRef'}
      responses:
        '204': {description: Timer reset}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /admin/list-topics:
    post:
      tags: [topics]
      summary: List topics
      operationId: adminListTopics
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminListTopicsRequest'}
      responses:
        '200':
          description: Topic listings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminListTopicsResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /admin/describe-topic:
    post:
      tags: [topics]
      summary: Describe a topic by name or topic id
      description: Exactly one of `topicName` and `topicId` must be provided, otherwise `400`.
      operationId: adminDescribeTopic
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminDescribeTopicRequest'}
      responses:
        '200':
          description: Topic description
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminDescribeTopicResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /admin/create-topic:
    post:
      tags: [topics]
      summary: Create a topic
      description: |
        `numPartitions` and `replicationFactor` are optional — the broker defaults
        are used when omitted. Returns the created topic details.
      operationId: adminCreateTopic
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminCreateTopicRequest'}
      responses:
        '200':
          description: Topic created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminCreateTopicResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /admin/create-topics:
    post:
      tags: [topics]
      summary: Create multiple topics
      description: |
        Not atomic — each topic is created independently. The response contains a
        creation status entry per topic. HTTP status is `200` even when some topics fail.
      operationId: adminCreateTopics
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminCreateTopicsRequest'}
      responses:
        '200':
          description: Per-topic creation results
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminCreateTopicsResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /admin/delete-topic:
    post:
      tags: [topics]
      summary: Delete a topic by name or topic id
      description: |
        Specify `topicName` or `topicId`. When both are provided, `topicId` is
        used. `400` when neither is provided.
      operationId: adminDeleteTopic
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminDeleteTopicRequest'}
      responses:
        '204': {description: Topic deleted}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /admin/delete-topics:
    post:
      tags: [topics]
      summary: Delete multiple topics by names or topic ids
      description: |
        Specify `topicNames` or `topicIds`. When both are provided, `topicIds`
        is used. `400` when neither is provided.

        Not atomic — each topic is deleted independently. The response contains a
        deletion status entry per topic. HTTP status is `200` even when some topics fail.
      operationId: adminDeleteTopics
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminDeleteTopicsRequest'}
      responses:
        '200':
          description: Per-topic deletion results
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminDeleteTopicsResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /admin/create-partitions:
    post:
      tags: [topics]
      summary: Increase the partition count of a topic
      operationId: adminCreatePartitions
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminCreatePartitionsRequest'}
      responses:
        '204': {description: Partitions created}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /admin/describe-topic-configs:
    post:
      tags: [configs]
      summary: Describe the configuration of a topic
      operationId: adminDescribeTopicConfigs
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminTopicNameRequest'}
      responses:
        '200':
          description: Config entries
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminConfigResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /admin/describe-broker-configs:
    post:
      tags: [configs]
      summary: Describe the configuration of a broker
      operationId: adminDescribeBrokerConfigs
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminDescribeBrokerConfigsRequest'}
      responses:
        '200':
          description: Config entries
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminConfigResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /admin/set-topic-config:
    post:
      tags: [configs]
      summary: Set (incrementally alter) a single topic config entry
      operationId: adminSetTopicConfig
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminSetTopicConfigRequest'}
      responses:
        '200': {description: "Config entry set, empty body"}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /admin/delete-topic-config:
    post:
      tags: [configs]
      summary: Delete (revert to default) a single topic config entry
      operationId: adminDeleteTopicConfig
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminDeleteTopicConfigRequest'}
      responses:
        '200': {description: "Config entry deleted, empty body"}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /admin/describe-cluster:
    post:
      tags: [cluster]
      summary: Describe the cluster (id, controller, nodes)
      operationId: adminDescribeCluster
      requestBody: {$ref: '#/components/requestBodies/AdminInstanceRef'}
      responses:
        '200':
          description: Cluster description
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminDescribeClusterResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /admin/describe-log-dirs:
    post:
      tags: [cluster]
      summary: Describe log directories of the given brokers
      operationId: adminDescribeLogDirs
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminDescribeLogDirsRequest'}
      responses:
        '200':
          description: Per-broker log dir descriptions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminDescribeLogDirsResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /admin/describe-user-scram-credentials:
    post:
      tags: [scram]
      summary: Describe SCRAM credentials of the given users
      operationId: adminDescribeUserScramCredentials
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminDescribeUserScramCredentialsRequest'}
      responses:
        '200':
          description: SCRAM credential descriptions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminDescribeUserScramCredentialsResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /admin/upsert-user-scram-credentials:
    post:
      tags: [scram]
      summary: Create or update a SCRAM credential for a user
      operationId: adminUpsertUserScramCredentials
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminUpsertUserScramCredentialsRequest'}
      responses:
        '200': {description: "Credential upserted, empty body"}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /admin/delete-user-scram-credentials:
    post:
      tags: [scram]
      summary: Delete a SCRAM credential of a user
      operationId: adminDeleteUserScramCredentials
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminDeleteUserScramCredentialsRequest'}
      responses:
        '200': {description: "Credential deleted, empty body"}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /admin/describe-acls:
    post:
      tags: [acls]
      summary: Describe ACLs matching the given filter
      operationId: adminDescribeAcls
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminDescribeAclsRequest'}
      responses:
        '200':
          description: Matching ACL bindings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminDescribeAclsResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /admin/create-acls:
    post:
      tags: [acls]
      summary: Create ACL bindings
      operationId: adminCreateAcls
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminCreateAclsRequest'}
      responses:
        '204': {description: ACLs created}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /admin/delete-acls:
    post:
      tags: [acls]
      summary: Delete ACL bindings matching the given filters
      operationId: adminDeleteAcls
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminDeleteAclsRequest'}
      responses:
        '204': {description: ACLs deleted}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /admin/describe-producers:
    post:
      tags: [producers]
      summary: Describe active transactional producers on the given partitions
      operationId: adminDescribeProducers
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminDescribeProducersRequest'}
      responses:
        '200':
          description: Per-partition producer states
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminDescribeProducersResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /admin/abort-transaction:
    post:
      tags: [producers]
      summary: Abort a stuck transaction
      description: |
        Aborts the transaction identified by the partition and the producer
        coordinates (obtainable from `/admin/describe-producers`).
      operationId: adminAbortTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminAbortTransactionRequest'}
      responses:
        '204': {description: Transaction aborted}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /admin/list-groups:
    post:
      tags: [groups]
      summary: List groups, optionally filtered by type/protocol/state
      operationId: adminListGroups
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminListGroupsRequest'}
      responses:
        '200':
          description: Group listings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminListGroupsResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /admin/describe-classic-group:
    post:
      tags: [groups]
      summary: Describe a classic (old consumer/other protocol) group
      operationId: adminDescribeClassicGroup
      requestBody: {$ref: '#/components/requestBodies/AdminGroupIdRequest'}
      responses:
        '200':
          description: Classic group description
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminDescribeClassicGroupResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /admin/describe-consumer-group:
    post:
      tags: [groups]
      summary: Describe a consumer group
      operationId: adminDescribeConsumerGroup
      requestBody: {$ref: '#/components/requestBodies/AdminGroupIdRequest'}
      responses:
        '200':
          description: Consumer group description
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminDescribeConsumerGroupResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /admin/describe-share-group:
    post:
      tags: [groups]
      summary: Describe a share group
      operationId: adminDescribeShareGroup
      requestBody: {$ref: '#/components/requestBodies/AdminGroupIdRequest'}
      responses:
        '200':
          description: Share group description
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminDescribeShareGroupResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /admin/describe-streams-group:
    post:
      tags: [groups]
      summary: Describe a streams application group
      operationId: adminDescribeStreamsGroup
      requestBody: {$ref: '#/components/requestBodies/AdminGroupIdRequest'}
      responses:
        '200':
          description: Streams group description
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminDescribeStreamsGroupResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /admin/list-consumer-group-offsets:
    post:
      tags: [groups]
      summary: List committed offsets of a consumer group
      operationId: adminListConsumerGroupOffsets
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminListConsumerGroupOffsetsRequest'}
      responses:
        '200':
          description: Committed offsets
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminListConsumerGroupOffsetsResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /admin/alter-consumer-group-offsets:
    post:
      tags: [groups]
      summary: Alter (reset) committed offsets of a consumer group
      description: The group must be empty (inactive), otherwise `409`.
      operationId: adminAlterConsumerGroupOffsets
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminAlterConsumerGroupOffsetsRequest'}
      responses:
        '204': {description: Offsets altered}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /admin/delete-consumer-group-offsets:
    post:
      tags: [groups]
      summary: Delete committed offsets of partitions of a consumer group
      operationId: adminDeleteConsumerGroupOffsets
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminDeleteConsumerGroupOffsetsRequest'}
      responses:
        '204': {description: Offsets deleted}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /admin/remove-members-from-consumer-group:
    post:
      tags: [groups]
      summary: Remove members from a consumer group
      description: Omit `members` to remove all members.
      operationId: adminRemoveMembersFromConsumerGroup
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminRemoveMembersFromConsumerGroupRequest'}
      responses:
        '204': {description: Members removed}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /admin/delete-consumer-group:
    post:
      tags: [groups]
      summary: Delete an empty consumer group
      operationId: adminDeleteConsumerGroup
      requestBody: {$ref: '#/components/requestBodies/AdminGroupIdRequest'}
      responses:
        '204': {description: Group deleted}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
