        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /consumer/get-committed:
    post:
      tags: [consumer]
      summary: Get the last committed offsets of the given partitions
      operationId: consumerGetCommitted
      requestBody: {$ref: '#/components/requestBodies/ConsumerPartitionsRequest'}
      responses:
        '200':
          description: Committed offsets grouped by topic
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConsumerCommittedResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /consumer/get-beginning-offsets:
    post:
      tags: [consumer]
      summary: Get the earliest available offsets of the given partitions
      operationId: consumerGetBeginningOffsets
      requestBody: {$ref: '#/components/requestBodies/ConsumerPartitionsRequest'}
      responses:
        '200':
          description: Offsets grouped by topic
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConsumerOffsetsResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /consumer/get-end-offsets:
    post:
      tags: [consumer]
      summary: Get the latest offsets of the given partitions
      operationId: consumerGetEndOffsets
      requestBody: {$ref: '#/components/requestBodies/ConsumerPartitionsRequest'}
      responses:
        '200':
          description: Offsets grouped by topic
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConsumerOffsetsResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        Optional — enabled only when the gateway is started with a `users.json`
        file in its working directory.

  responses:
    BadRequest:
      description: Invalid JSON, validation failure or Kafka invalid request
      content:
        text/plain:
          schema: {$ref: '#/components/schemas/ErrorMessage'}
    Unauthorized:
      description: Authentication required or failed
      content:
        text/plain:
          schema: {$ref: '#/components/schemas/ErrorMessage'}
    Forbidden:
      description: Not authorized (Kafka broker ACLs)
      content:
        text/plain:
          schema: {$ref: '#/components/schemas/ErrorMessage'}
    NotFound:
      description: Unknown admin instance or route
      content:
        text/plain:
          schema: {$ref: '#/components/schemas/ErrorMessage'}
    MethodNotAllowed:
      description: Unsupported HTTP method
      content:
        text/plain:
          schema: {$ref: '#/components/schemas/ErrorMessage'}
    Conflict:
      description: Conflict (topic exists, group not empty, illegal state)
      content:
        text/plain:
          schema: {$ref: '#/components/schemas/ErrorMessage'}
    InternalServerError:
      description: Internal error (timeout, interrupted, unexpected)
      content:
        text/plain:
          schema: {$ref: '#/components/schemas/ErrorMessage'}

  requestBodies:
    AdminInstanceRef:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AdminInstanceRef'}
    AdminGroupIdRequest:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AdminGroupIdRequest'}
    AdminGroupIdsRequest:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AdminGroupIdsRequest'}
    AdminListOffsetsRequest:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AdminListOffsetsRequest'}
    ProducerInstanceRef:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ProducerInstanceRef'}
    ConsumerInstanceRef:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ConsumerInstanceRef'}
    ConsumerPartitionsRequest:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ConsumerPartitionsRequest'}

  schemas:
    ErrorMessage:
      type: string
      description: Human-readable error message

    AdminInstanceRef:
      type: object
      description: Reference to an admin instance
      required: [adminId, token]
      properties:
        adminId:
          type: string
          description: Admin instance id returned by `POST /admin/create`
        token:
          type: string
          description: Ownership token returned by `POST /admin/create`

    AdminGroupIdRequest:
      allOf:
        - $ref: '#/components/schemas/AdminInstanceRef'
        - type: object
          required: [groupId]
          properties:
            groupId:
              type: string
              minLength: 1
            includeAuthorizedOperations:
              type: boolean
              description: Include ACL operations authorized for the caller

    AdminGroupIdsRequest:
      allOf:
        - $ref: '#/components/schemas/AdminInstanceRef'
        - type: object
          required: [groupIds]
          properties:
            groupIds:
              type: array
              minItems: 1
              items:
                type: string
                minLength: 1

    TopicPartition:
      type: object
      required: [topic, partition]
      properties:
        topic:
          type: string
          minLength: 1
        partition:
          type: integer
          minimum: 0

    Node:
      type: object
      description: Kafka broker node
      properties:
        id: {type: integer}
        host: {type: string}
        port: {type: integer}
        rack: {type: string, nullable: true}
        fenced: {type: boolean}

    PartitionInfo:
      type: object
      properties:
        partition: {type: integer}
        leader: {$ref: '#/components/schemas/Node'}
        replicas:
          type: array
          items: {$ref: '#/components/schemas/Node'}
        isr:
          type: array
          description: In-sync replica broker ids
          items: {type: integer, nullable: true}
        elr:
          type: array
          description: Eligible leader replica broker ids
          items: {type: integer, nullable: true}
        lastKnownElr:
          type: array
          description: Last known eligible leader replica broker ids
          items: {type: integer, nullable: true}

    ConfigEntry:
      type: object
      properties:
        name: {type: string}
        value: {type: string, nullable: true}
        source:
          type: string
          description: Config source (e.g. `DYNAMIC_TOPIC_CONFIG`, `DEFAULT_CONFIG`)
        default: {type: boolean}
        sensitive: {type: boolean}
        readOnly: {type: boolean}
        type:
          type: string
          description: Config data type (e.g. `STRING`, `INT`, `LONG`, `BOOLEAN`, `LIST`, `PASSWORD`)
        documentation: {type: string, nullable: true}

    AdminConfigResponse:
      type: array
      items: {$ref: '#/components/schemas/ConfigEntry'}

    AdminCreateRequest:
      type: object
      required: [name, config]
      properties:
        name:
          type: string
          description: Human-readable instance name
          minLength: 1
        config:
          type: object
          description: Arbitrary Kafka client properties (`bootstrap.servers`, SASL, etc.)
          minProperties: 1
          additionalProperties: {type: string}
        expirationTimeout:
          type: integer
          description: Instance expiration timeout in milliseconds (1 second to 24 hours)
          minimum: 1000
          maximum: 86400000

    AdminCreateResponse:
      type: object
      properties:
        id:
          type: string
          description: Admin instance id
        token:
          type: string
          description: Ownership token

    AdminListResponse:
      type: array
      items:
        type: object
        properties:
          id: {type: string}
          name: {type: string}
          owner: {type: string}
          username: {type: string, nullable: true}
          expiresAt:
            type: integer
            format: int64
            description: Expiration timestamp, epoch millis

    AdminTopicNameRequest:
      allOf:
        - $ref: '#/components/schemas/AdminInstanceRef'
        - type: object
          required: [topicName]
          properties:
            topicName:
              type: string
              minLength: 1

    AdminListTopicsRequest:
      allOf:
        - $ref: '#/components/schemas/AdminInstanceRef'
        - type: object
          properties:
            includeInternal:
              type: boolean
              description: Include internal topics
            pattern:
              type: string
              description: Regex to filter topic names

    AdminListTopicsResponse:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            description: Kafka topic UUID as a base64url string
          name: {type: string}
          internal: {type: boolean}

    AdminDescribeTopicRequest:
      allOf:
        - $ref: '#/components/schemas/AdminInstanceRef'
        - type: object
          properties:
            topicName: {type: string}
            topicId:
              type: string
              description: Kafka topic UUID as a base64url string
            includeAuthorizedOperations: {type: boolean}
      description: Exactly one of `topicName` and `topicId` must be provided.

    AdminDescribeTopicResponse:
      type: object
      properties:
        id:
          type: string
          description: Topic UUID as a base64url string
        name: {type: string}
        internal: {type: boolean}
        authorizedOperations:
          type: array
          nullable: true
          items: {$ref: '#/components/schemas/AclOperation'}
        partitions:
          type: array
          items: {$ref: '#/components/schemas/PartitionInfo'}

    AdminCreateTopicRequest:
      allOf:
        - $ref: '#/components/schemas/AdminInstanceRef'
        - type: object
          required: [topicName]
          properties:
            topicName:
              type: string
              minLength: 1
            numPartitions:
              type: integer
              exclusiveMinimum: 0
              description: Omit to use the broker default
            replicationFactor:
              type: integer
              exclusiveMinimum: 0
              description: Omit to use the broker default
            validateOnly:
              type: boolean
              description: |
                When true, the topic is validated but not actually created.
                Default: false.
            retryOnQuotaViolation:
              type: boolean
              description: |
                Whether to retry the creation when a quota violation occurs.
                Default: true.

    AdminCreateTopicResponse:
      type: object
      properties:
        topicId:
          type: string
          description: Created topic UUID as a base64url string
        numPartitions: {type: integer, nullable: true}
        replicationFactor: {type: integer, nullable: true}
        config: {$ref: '#/components/schemas/AdminConfigResponse'}

    TopicSpec:
      type: object
      required: [topicName]
      properties:
        topicName:
          type: string
          minLength: 1
        numPartitions:
          type: integer
          exclusiveMinimum: 0
          description: Omit to use the broker default
        replicationFactor:
          type: integer
          exclusiveMinimum: 0
          description: Omit to use the broker default

    AdminCreateTopicsRequest:
      allOf:
        - $ref: '#/components/schemas/AdminInstanceRef'
        - type: object
          required: [topics]
          properties:
            topics:
              type: array
              minItems: 1
              items: {$ref: '#/components/schemas/TopicSpec'}
            validateOnly:
              type: boolean
              description: |
                When true, topics are validated but not actually created; the
                response reports per-topic validation errors. Default: false.
            retryOnQuotaViolation:
              type: boolean
              description: |
                Whether to retry the creation when a quota violation occurs.
                Default: true.

    TopicCreationResult:
      allOf:
        - $ref: '#/components/schemas/AdminCreateTopicResponse'
        - type: object
          properties:
            success:
              type: boolean
              description: Whether this topic was created
            errorMessage:
              type: string
              nullable: true
              description: Error message when `success` is false
            topicName: {type: string}

    AdminCreateTopicsResponse:
      type: array
      items: {$ref: '#/components/schemas/TopicCreationResult'}

    AdminDeleteTopicRequest:
      allOf:
        - $ref: '#/components/schemas/AdminInstanceRef'
        - type: object
          properties:
            topicName:
              type: string
            topicId:
              type: string
              description: Kafka topic UUID as a base64url string
      description: |
        Specify `topicName` or `topicId`. When both are provided, `topicId` is used.

    AdminDeleteTopicsRequest:
      allOf:
        - $ref: '#/components/schemas/AdminInstanceRef'
        - type: object
          properties:
            topicNames:
              type: array
              minItems: 1
              items:
                type: string
                minLength: 1
            topicIds:
              type: array
              minItems: 1
              description: Kafka topic UUIDs as base64url strings
              items:
                type: string
      description: |
        Specify `topicNames` or `topicIds`. When both are provided, `topicIds` is used.

    TopicDeletionResult:
      type: object
      properties:
        topicId:
          type: string
          nullable: true
          description: Topic UUID as a base64url string, present when deleting by ids
        topicName:
          type: string
          nullable: true
          description: Topic name, present when deleting by names
        success:
          type: boolean
          description: Whether this topic was deleted
        errorMessage:
          type: string
          nullable: true
          description: Error message when `success` is false

    AdminDeleteTopicsResponse:
      type: array
      items: {$ref: '#/components/schemas/TopicDeletionResult'}

    AdminCreatePartitionsRequest:
      allOf:
        - $ref: '#/components/schemas/AdminInstanceRef'
        - type: object
          required: [topicName, increaseTo]
          properties:
            topicName:
              type: string
              minLength: 1
            increaseTo:
              type: integer
              description: New total partition count (must be greater than the current count)
              exclusiveMinimum: 0

    AdminDescribeBrokerConfigsRequest:
      allOf:
        - $ref: '#/components/schemas/AdminInstanceRef'
        - type: object
          required: [brokerId]
          properties:
            brokerId:
              type: integer
              minimum: 0

    AdminSetTopicConfigRequest:
      allOf:
        - $ref: '#/components/schemas/AdminInstanceRef'
        - type: object
          required: [topicName, configName, newValue]
          properties:
            topicName:
              type: string
              minLength: 1
            configName:
              type: string
              minLength: 1
            newValue:
              type: string
              description: May be an empty string

    AdminDeleteTopicConfigRequest:
      allOf:
        - $ref: '#/components/schemas/AdminInstanceRef'
        - type: object
          required: [topicName, configName]
          properties:
            topicName:
              type: string
              minLength: 1
            configName:
              type: string
              minLength: 1

    AdminDescribeClusterResponse:
      type: object
      properties:
        clusterId: {type: string}
        controller: {$ref: '#/components/schemas/Node'}
        nodes:
          type: array
          items: {$ref: '#/components/schemas/Node'}
        authorizedOperations:
          type: array
          nullable: true
          items: {$ref: '#/components/schemas/AclOperation'}

    AdminDescribeLogDirsRequest:
      allOf:
        - $ref: '#/components/schemas/AdminInstanceRef'
        - type: object
          required: [brokerIds]
          properties:
            brokerIds:
              type: array
              minItems: 1
              items:
                type: integer
                minimum: 0

    TopicPartitionReplicaInfo:
      type: object
      properties:
        topic: {type: string}
        partition: {type: integer}
        size:
          type: integer
          format: int64
          description: Replica size in bytes
        offsetLag: {type: integer, format: int64}
        future:
          type: boolean
          description: Whether this is a future replica

    LogDirDescription:
      type: object
      properties:
        path: {type: string}
        errorMessage:
          type: string
          nullable: true
          description: Error querying this log dir, if any
        replicaInfos:
          type: array
          items: {$ref: '#/components/schemas/TopicPartitionReplicaInfo'}

    BrokersLogDirsDescription:
      type: object
      properties:
        brokerId: {type: integer, nullable: true}
        logDirs:
          type: array
          items: {$ref: '#/components/schemas/LogDirDescription'}

    AdminDescribeLogDirsResponse:
      type: array
      items: {$ref: '#/components/schemas/BrokersLogDirsDescription'}

    AdminDescribeUserScramCredentialsRequest:
      allOf:
        - $ref: '#/components/schemas/AdminInstanceRef'
        - type: object
          required: [users]
          properties:
            users:
              type: array
              minItems: 1
              items:
                type: string
                minLength: 1

    ScramCredentialInfo:
      type: object
      properties:
        scramMechanism: {$ref: '#/components/schemas/ScramMechanism'}
        iterations: {type: integer}

    ScramCredentialDescription:
      type: object
      properties:
        name:
          type: string
          description: User name
        credentialInfos:
          type: array
          items: {$ref: '#/components/schemas/ScramCredentialInfo'}

    AdminDescribeUserScramCredentialsResponse:
      type: array
      items: {$ref: '#/components/schemas/ScramCredentialDescription'}

    AdminUpsertUserScramCredentialsRequest:
      allOf:
        - $ref: '#/components/schemas/AdminInstanceRef'
        - type: object
          required: [user, mechanism, password]
          properties:
            user:
              type: string
              minLength: 1
            mechanism: {$ref: '#/components/schemas/ScramMechanism'}
            password:
              type: string
              description: May be an empty string
            iterations:
              type: integer
              description: Omit to use the broker default

    AdminDeleteUserScramCredentialsRequest:
      allOf:
        - $ref: '#/components/schemas/AdminInstanceRef'
        - type: object
          required: [user, mechanism]
          properties:
            user:
              type: string
              minLength: 1
            mechanism: {$ref: '#/components/schemas/ScramMechanism'}

    ScramMechanism:
      type: string
      enum: [SCRAM-SHA-256, SCRAM-SHA-512]

    ResourceType:
      type: string
      enum: [UNKNOWN, ANY, TOPIC, GROUP, CLUSTER, TRANSACTIONAL_ID, DELEGATION_TOKEN]

    PatternType:
      type: string
      enum: [UNKNOWN, ANY, MATCH, LITERAL, PREFIXED]

    AclOperation:
      type: string
      enum: [UNKNOWN, ANY, ALL, READ, WRITE, CREATE, DELETE, ALTER, DESCRIBE,
             CLUSTER_ACTION, DESCRIBE_CONFIGS, ALTER_CONFIGS, IDEMPOTENT_WRITE,
             CREATE_TOKENS, DESCRIBE_TOKENS]

    AclPermissionType:
      type: string
      enum: [UNKNOWN, ANY, DENY, ALLOW]

    AclResourcePattern:
      type: object
      properties:
        resourceType: {type: string}
        name: {type: string, nullable: true}
        patternType: {type: string}

    AclAccessControlEntry:
      type: object
      properties:
        principal: {type: string}
        host: {type: string}
        operation: {type: string}
        permissionType: {type: string}

    AclBinding:
      type: object
      required: [pattern, entry]
      properties:
        pattern: {$ref: '#/components/schemas/AclResourcePattern'}
        entry: {$ref: '#/components/schemas/AclAccessControlEntry'}

    AclResourcePatternFilter:
      type: object
      required: [resourceType, patternType]
      properties:
        resourceType: {$ref: '#/components/schemas/ResourceType'}
        name:
          type: string
          nullable: true
          description: Omit to match any name
        patternType: {$ref: '#/components/schemas/PatternType'}

    AclAccessControlEntryFilter:
      type: object
      required: [operation, permissionType]
      properties:
        principal:
          type: string
          nullable: true
          description: Omit to match any principal
        host:
          type: string
          nullable: true
          description: Omit to match any host
        operation: {$ref: '#/components/schemas/AclOperation'}
        permissionType: {$ref: '#/components/schemas/AclPermissionType'}

    AclBindingFilter:
      type: object
      properties:
        patternFilter: {$ref: '#/components/schemas/AclResourcePatternFilter'}
        entryFilter: {$ref: '#/components/schemas/AclAccessControlEntryFilter'}

    AdminDescribeAclsRequest:
      allOf:
        - $ref: '#/components/schemas/AdminInstanceRef'
        - type: object
          properties:
            filter: {$ref: '#/components/schemas/AclBindingFilter'}

    AdminDescribeAclsResponse:
      type: array
      items: {$ref: '#/components/schemas/AclBinding'}

    AdminCreateAclsRequest:
      allOf:
        - $ref: '#/components/schemas/AdminInstanceRef'
        - type: object
          required: [acls]
          properties:
            acls:
              type: array
              minItems: 1
              items: {$ref: '#/components/schemas/AclBinding'}

    AdminDeleteAclsRequest:
      allOf:
        - $ref: '#/components/schemas/AdminInstanceRef'
        - type: object
          required: [filters]
          properties:
            filters:
              type: array
              minItems: 1
              items: {$ref: '#/components/schemas/AclBindingFilter'}

    AdminDescribeProducersRequest:
      allOf:
        - $ref: '#/components/schemas/AdminInstanceRef'
        - type: object
          required: [partitions]
          properties:
            partitions:
              type: array
              minItems: 1
              items: {$ref: '#/components/schemas/TopicPartition'}

    ProducerState:
      type: object
      properties:
        producerId: {type: integer, format: int64}
        producerEpoch: {type: integer}
        lastSequence: {type: integer}
        lastTimestamp:
          type: integer
          format: int64
          description: Epoch millis
        currentTransactionStartOffset:
          type: integer
          format: int64
          nullable: true
          description: Present only while a transaction is open
        coordinatorEpoch:
          type: integer
          nullable: true

    PartitionProducerState:
      type: object
      properties:
        topic: {type: string}
        partition: {type: integer}
        activeProducers:
          type: array
          items: {$ref: '#/components/schemas/ProducerState'}

    AdminDescribeProducersResponse:
      type: array
      items: {$ref: '#/components/schemas/PartitionProducerState'}

    AdminAbortTransactionRequest:
      allOf:
        - $ref: '#/components/schemas/AdminInstanceRef'
        - type: object
          required: [partition, producerId, producerEpoch, coordinatorEpoch]
          properties:
            partition: {$ref: '#/components/schemas/TopicPartition'}
            producerId:
              type: integer
              format: int64
            producerEpoch:
              type: integer
              description: Kafka `short` range (0..32767)
            coordinatorEpoch: {type: integer}

    GroupListing:
      type: object
      properties:
        groupId: {type: string}
        type:
          type: string
          nullable: true
          description: Group type (`consumer`, `classic`, `share`, `streams`)
        protocol:
          type: string
          nullable: true
        groupState:
          type: string
          nullable: true
        simpleConsumerGroup: {type: boolean}

    AdminListGroupsRequest:
      allOf:
        - $ref: '#/components/schemas/AdminInstanceRef'
        - type: object
          properties:
            withTypes:
              type: array
              description: Filter by group types
              items: {type: string}
            withProtocolTypes:
              type: array
              description: Filter by protocol types
              items: {type: string}
            inStates:
              type: array
              description: Filter by group states
              items: {type: string}

    AdminListGroupsResponse:
      type: array
      items: {$ref: '#/components/schemas/GroupListing'}

    GroupMemberDescription:
      type: object
      properties:
        consumerId: {type: string}
        groupInstanceId: {type: string, nullable: true}
        clientId: {type: string}
        host: {type: string}
        assignment:
          type: array
          items: {$ref: '#/components/schemas/TopicPartition'}
        targetAssignment:
          type: array
          nullable: true
          items: {$ref: '#/components/schemas/TopicPartition'}
        memberEpoch: {type: integer, nullable: true}
        upgraded: {type: boolean, nullable: true}

    AdminDescribeClassicGroupResponse:
      type: object
      properties:
        groupId: {type: string}
        protocol: {type: string, nullable: true}
        protocolData: {type: string, nullable: true}
        members:
          type: array
          items: {$ref: '#/components/schemas/GroupMemberDescription'}
        state: {type: string, nullable: true}
        coordinator: {$ref: '#/components/schemas/Node'}
        simpleConsumerGroup: {type: boolean}
        authorizedOperations:
          type: array
          nullable: true
          items: {$ref: '#/components/schemas/AclOperation'}

    AdminDescribeConsumerGroupResponse:
      type: object
      properties:
        groupId: {type: string}
        simpleConsumerGroup: {type: boolean}
        members:
          type: array
          items: {$ref: '#/components/schemas/GroupMemberDescription'}
        partitionAssignor: {type: string, nullable: true}
        type: {type: string, nullable: true}
        groupState: {type: string, nullable: true}
        coordinator: {$ref: '#/components/schemas/Node'}
        authorizedOperations:
          type: array
          nullable: true
          items: {$ref: '#/components/schemas/AclOperation'}
        groupEpoch: {type: integer, nullable: true}
        targetAssignmentEpoch: {type: integer, nullable: true}

    ShareGroupMemberDescription:
      type: object
      properties:
        consumerId: {type: string}
        clientId: {type: string}
        host: {type: string}
        assignment:
          type: array
          items: {$ref: '#/components/schemas/TopicPartition'}
        memberEpoch: {type: integer}

    AdminDescribeShareGroupResponse:
      type: object
      properties:
        groupId: {type: string}
        members:
          type: array
          items: {$ref: '#/components/schemas/ShareGroupMemberDescription'}
        groupState: {type: string, nullable: true}
        coordinator: {$ref: '#/components/schemas/Node'}
        groupEpoch: {type: integer}
        targetAssignmentEpoch: {type: integer}
        authorizedOperations:
          type: array
          nullable: true
          items: {$ref: '#/components/schemas/AclOperation'}

    StreamsGroupTaskIds:
      type: object
      properties:
        subtopologyId: {type: string}
        partitions:
          type: array
          items: {type: integer}

    StreamsGroupMemberAssignment:
      type: object
      properties:
        activeTasks:
          type: array
          items: {$ref: '#/components/schemas/StreamsGroupTaskIds'}
        standbyTasks:
          type: array
          items: {$ref: '#/components/schemas/StreamsGroupTaskIds'}
        warmupTasks:
          type: array
          items: {$ref: '#/components/schemas/StreamsGroupTaskIds'}

    StreamsGroupTaskOffset:
      type: object
      properties:
        subtopologyId: {type: string}
        partition: {type: integer}
        offset: {type: integer, format: int64}

    StreamsGroupEndpoint:
      type: object
      properties:
        host: {type: string}
        port: {type: integer}

    StreamsGroupMemberDescription:
      type: object
      properties:
        memberId: {type: string}
        memberEpoch: {type: integer}
        instanceId: {type: string, nullable: true}
        rackId: {type: string, nullable: true}
        clientId: {type: string}
        clientHost: {type: string}
        topologyEpoch: {type: integer}
        processId: {type: string}
        userEndpoint:
          allOf:
            - $ref: '#/components/schemas/StreamsGroupEndpoint'
          nullable: true
        clientTags:
          type: object
          additionalProperties: {type: string}
          nullable: true
        taskOffsets:
          type: array
          items: {$ref: '#/components/schemas/StreamsGroupTaskOffset'}
        taskEndOffsets:
          type: array
          items: {$ref: '#/components/schemas/StreamsGroupTaskOffset'}
        assignment: {$ref: '#/components/schemas/StreamsGroupMemberAssignment'}
        targetAssignment: {$ref: '#/components/schemas/StreamsGroupMemberAssignment'}
        classic:
          type: boolean
          description: Whether the member runs in classic (pre-KIP-1071) mode

    StreamsGroupTopicInfo:
      type: object
      properties:
        partitions: {type: integer}
        replicationFactor: {type: integer}
        topicConfigs:
          type: object
          additionalProperties: {type: string}

    StreamsGroupSubtopologyDescription:
      type: object
      properties:
        subtopologyId: {type: string}
        sourceTopics:
          type: array
          items: {type: string}
        repartitionSinkTopics:
          type: array
          items: {type: string}
        stateChangelogTopics:
          type: object
          additionalProperties: {$ref: '#/components/schemas/StreamsGroupTopicInfo'}
        repartitionSourceTopics:
          type: object
          additionalProperties: {$ref: '#/components/schemas/StreamsGroupTopicInfo'}

    AdminDescribeStreamsGroupResponse:
      type: object
      properties:
        groupId: {type: string}
        groupEpoch: {type: integer}
        targetAssignmentEpoch: {type: integer}
        topologyEpoch: {type: integer}
        subtopologies:
          type: array
          items: {$ref: '#/components/schemas/StreamsGroupSubtopologyDescription'}
        members:
          type: array
          items: {$ref: '#/components/schemas/StreamsGroupMemberDescription'}
        groupState: {type: string, nullable: true}
        coordinator: {$ref: '#/components/schemas/Node'}
        authorizedOperations:
          type: array
          nullable: true
          items: {$ref: '#/components/schemas/AclOperation'}

    AdminListConsumerGroupOffsetsRequest:
      allOf:
        - $ref: '#/components/schemas/AdminInstanceRef'
        - type: object
          required: [groupId]
          properties:
            groupId:
              type: string
              minLength: 1
            requireStable:
              type: boolean
              description: When true, fails while a transaction is in progress

    TopicPartitionOffsetMetadata:
      type: object
      properties:
        topic: {type: string}
        partition: {type: integer}
        offset: {type: integer, format: int64}
        leaderEpoch: {type: integer, nullable: true}
        metadata: {type: string, nullable: true}

    AdminListConsumerGroupOffsetsResponse:
      type: array
      items: {$ref: '#/components/schemas/TopicPartitionOffsetMetadata'}

    AdminAlterConsumerGroupOffsetsRequest:
      allOf:
        - $ref: '#/components/schemas/AdminInstanceRef'
        - type: object
          required: [groupId, offsets]
          properties:
            groupId:
              type: string
              minLength: 1
            offsets:
              type: array
              minItems: 1
              items:
                type: object
                required: [topic, partition, offset]
                properties:
                  topic:
                    type: string
                    minLength: 1
                  partition:
                    type: integer
                    minimum: 0
                  offset:
                    type: integer
                    format: int64
                    minimum: 0
                  metadata: {type: string}

    AdminDeleteConsumerGroupOffsetsRequest:
      allOf:
        - $ref: '#/components/schemas/AdminInstanceRef'
        - type: object
          required: [groupId, partitions]
          properties:
            groupId:
              type: string
              minLength: 1
            partitions:
              type: array
              minItems: 1
              items: {$ref: '#/components/schemas/TopicPartition'}

    AdminRemoveMembersFromConsumerGroupRequest:
      allOf:
        - $ref: '#/components/schemas/AdminInstanceRef'
        - type: object
          required: [groupId]
          properties:
            groupId:
              type: string
              minLength: 1
            members:
              type: array
              description: Member ids to remove; omit to remove all members
              items: {type: string}
            reason:
              type: string
              description: Reason recorded in the broker log

    AdminListOffsetsRequest:
      allOf:
        - $ref: '#/components/schemas/AdminInstanceRef'
        - type: object
          required: [partitions]
          properties:
            partitions:
              type: array
              minItems: 1
              items: {$ref: '#/components/schemas/TopicPartition'}
            isolationLevel: {$ref: '#/components/schemas/IsolationLevel'}

    AdminListTimestampOffsetsRequest:
      allOf:
        - $ref: '#/components/schemas/AdminListOffsetsRequest'
        - type: object
          required: [timestamp]
          properties:
            timestamp:
              type: integer
              format: int64
              exclusiveMinimum: 0
              description: Epoch millis

    IsolationLevel:
      type: string
      enum: [READ_UNCOMMITTED, READ_COMMITTED]

    OffsetListing:
      type: object
      properties:
        topic: {type: string}
        partition: {type: integer}
        offset: {type: integer, format: int64}
        timestamp:
          type: integer
          format: int64
          description: Epoch millis of the offset, `-1` if unknown
        leaderEpoch: {type: integer, nullable: true}

    AdminListOffsetsResponse:
      type: array
      items: {$ref: '#/components/schemas/OffsetListing'}

    ProducerInstanceRef:
      type: object
      description: Reference to a producer instance
      required: [producerId, token]
      properties:
        producerId:
          type: string
          description: Producer instance id returned by `POST /producer/create`
        token:
          type: string
          description: Ownership token returned by `POST /producer/create`

    ConsumerInstanceRef:
      type: object
      description: Reference to a consumer instance
      required: [consumerId, token]
      properties:
        consumerId:
          type: string
          description: Consumer instance id returned by `POST /consumer/create`
        token:
          type: string
          description: Ownership token returned by `POST /consumer/create`

    ProducerCreateRequest:
      type: object
      required: [name, config]
      properties:
        name:
          type: string
          description: Human-readable instance name
          minLength: 1
        config:
          type: object
          description: Arbitrary Kafka client properties (`bootstrap.servers`, SASL, `transactional.id`, etc.)
          minProperties: 1
          additionalProperties: {type: string}
        expirationTimeout:
          type: integer
          description: Instance expiration timeout in milliseconds (1 second to 24 hours)
          minimum: 1000
          maximum: 86400000

    ProducerCreateResponse:
      type: object
      properties:
        id:
          type: string
          description: Producer instance id
        token:
          type: string
          description: Ownership token

    ProducerListResponse:
      type: array
      items:
        type: object
        properties:
          id: {type: string}
          name: {type: string}
          owner: {type: string}
          username: {type: string, nullable: true}
          expiresAt:
            type: integer
            format: int64
            description: Expiration timestamp, epoch millis

    ProducerSendStringRequest:
      type: object
      required: [producerId, token, topic]
      properties:
        producerId:
          type: string
        token:
          type: string
        topic:
          type: string
          minLength: 1
        partition:
          type: integer
          minimum: 0
          description: Omit to let Kafka choose the partition
        headers:
          type: object
          additionalProperties: {type: string}
        key:
          type: string
          nullable: true
        value:
          type: string
          nullable: true

    ProducerSendResponse:
      type: object
      properties:
        topic: {type: string}
        partition: {type: integer}
        offset: {type: integer, format: int64}
        timestamp:
          type: integer
          format: int64
          description: Epoch millis
        serializedKeySize: {type: integer}
        serializedValueSize: {type: integer}

    ProducerGetPartitionsRequest:
      allOf:
        - $ref: '#/components/schemas/ProducerInstanceRef'
        - type: object
          required: [topic]
          properties:
            topic:
              type: string
              minLength: 1

    ProducerPartitionsResponse:
      type: array
      items:
        type: object
        properties:
          partition: {type: integer}

    ConsumerCreateRequest:
      type: object
      required: [name, config]
      properties:
        name:
          type: string
          description: Human-readable instance name
          minLength: 1
        config:
          type: object
          description: Arbitrary Kafka client properties (`bootstrap.servers`, `group.id`, etc.)
          minProperties: 1
          additionalProperties: {type: string}
        expirationTimeout:
          type: integer
          description: Instance expiration timeout in milliseconds (1 second to 24 hours)
          minimum: 1000
          maximum: 86400000

    ConsumerCreateResponse:
      type: object
      properties:
        id:
          type: string
          description: Consumer instance id
        token:
          type: string
          description: Ownership token

    ConsumerListResponse:
      type: array
      items:
        type: object
        properties:
          id: {type: string}
          name: {type: string}
          owner: {type: string}
          username: {type: string, nullable: true}
          expiresAt:
            type: integer
            format: int64
            description: Expiration timestamp, epoch millis

    ConsumerPollRequest:
      allOf:
        - $ref: '#/components/schemas/ConsumerInstanceRef'
        - type: object
          required: [timeout]
          properties:
            timeout:
              type: integer
              format: int64
              minimum: 0
              description: Poll timeout in milliseconds

    ConsumerPollStringResponse:
      type: array
      description: |
        JSON poll result. Keys, values and header values are decoded as UTF-8
        strings. Use the binary response format for non-UTF-8 payloads.
      items:
        type: object
        properties:
          timestamp:
            type: integer
            format: int64
            description: Epoch millis
          topic: {type: string}
          partition: {type: integer}
          offset: {type: integer, format: int64}
          headers:
            type: array
            items:
              type: object
              properties:
                key: {type: string}
                value: {type: string, nullable: true}
          key: {type: string, nullable: true}
          value: {type: string, nullable: true}

    ConsumerSeekRequest:
      allOf:
        - $ref: '#/components/schemas/ConsumerInstanceRef'
        - type: object
          required: [topic, partition, offset]
          properties:
            topic:
              type: string
              minLength: 1
            partition:
              type: integer
              minimum: 0
            offset:
              type: integer
              format: int64
              minimum: 0

    ConsumerPartitionsRequest:
      allOf:
        - $ref: '#/components/schemas/ConsumerInstanceRef'
        - type: object
          required: [partitions]
          properties:
            partitions:
              type: array
              minItems: 1
              items: {$ref: '#/components/schemas/TopicPartition'}

    ConsumerGetPositionRequest:
      allOf:
        - $ref: '#/components/schemas/ConsumerInstanceRef'
        - type: object
          required: [topic, partition]
          properties:
            topic:
              type: string
              minLength: 1
            partition:
              type: integer
              minimum: 0

    ConsumerPositionResponse:
      type: object
      properties:
        offset: {type: integer, format: int64}

    ConsumerAssignmentResponse:
      type: array
      items: {$ref: '#/components/schemas/TopicPartition'}

    ConsumerSubscribeRequest:
      allOf:
        - $ref: '#/components/schemas/ConsumerInstanceRef'
        - type: object
          properties:
            topics:
              type: array
              description: Topic names to subscribe to
              items: {type: string}
            pattern:
              type: string
              description: Regex to subscribe to matching topics

    ConsumerSubscriptionResponse:
      type: array
      items: {type: string}

    ConsumerGetPartitionsRequest:
      allOf:
        - $ref: '#/components/schemas/ConsumerInstanceRef'
        - type: object
          required: [topic]
          properties:
            topic:
              type: string
              minLength: 1

    ConsumerPartitionsResponse:
      type: array
      items:
        type: object
        properties:
          partition: {type: integer}

    ConsumerListPartitionsResponse:
      type: object
      deprecated: true
      properties:
        topic: {type: string}
        partitions:
          type: array
          items:
            type: object
            properties:
              partition: {type: integer}

    ConsumerListTopicsRequest:
      allOf:
        - $ref: '#/components/schemas/ConsumerInstanceRef'
        - type: object
          properties:
            pattern:
              type: string
              description: Regex to filter topic names

    ConsumerTopicsResponse:
      type: array
      items:
        type: object
        properties:
          topic: {type: string}
          partitions:
            type: array
            items:
              type: object
              properties:
                partition: {type: integer}

    ConsumerGroupMetadataResponse:
      type: object
      properties:
        groupId: {type: string}
        generationId: {type: integer}
        memberId: {type: string}
        groupInstanceId: {type: string, nullable: true}

    ConsumerCommittedResponse:
      type: array
      items:
        type: object
        properties:
          topic: {type: string}
          offsets:
            type: array
            items:
              type: object
              properties:
                partition: {type: integer}
                offset:
                  type: integer
                  format: int64
                  nullable: true
                  description: Null when no committed offset exists
                metadata: {type: string, nullable: true}

    ConsumerOffsetsResponse:
      type: array
      items:
        type: object
        properties:
          topic: {type: string}
          offsets:
            type: array
            items:
              type: object
              properties:
                partition: {type: integer}
                offset:
                  type: integer
                  format: int64
                  nullable: true






